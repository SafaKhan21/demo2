<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سوبر ماركت | Super Market</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230F7B4F'/%3E%3Cpath d='M12 19h24l-2.6 15.4A3.4 3.4 0 0 1 30 37.3H18a3.4 3.4 0 0 1-3.4-2.9z' fill='%23fff'/%3E%3Cpath d='M18 19a6 6 0 0 1 12 0' stroke='%23F5B700' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0F7B4F; --green-dark:#0A5B3A; --green-soft:#E9F4EF; --green-line:#CDE6DA;
  --gold:#F5B700; --red:#E03A2F; --red-soft:#FDECEB; --blue:#1C6FD0;
  --ink:#16211C; --ink-2:#54635C; --ink-3:#8A968F;
  --line:#E7E9E6; --line-2:#F1F3F1; --bg:#FFFFFF; --bg-2:#F7F8F7;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --shadow:0 1px 2px rgba(22,33,28,.05), 0 6px 20px -14px rgba(22,33,28,.25);
  --max:1320px; --side:236px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
a{color:inherit;text-decoration:none}
ul{margin:0;padding:0;list-style:none}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:var(--max);margin:0 auto;padding-inline:20px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:16px;height:16px}
.sar{width:12px;height:12px;vertical-align:-1px;opacity:.85;margin-inline-start:3px}

/* ---------- TOP BAR ---------- */
.topbar{background:var(--green-dark);color:#fff;font-size:12.5px}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:40px}
.topbar .sep{flex:1}
.tb{display:inline-flex;align-items:center;gap:7px;color:#fff;opacity:.9;white-space:nowrap;line-height:1;transition:opacity .15s}
a.tb:hover{opacity:1}
.tb .ico{width:15px;height:15px;stroke-width:1.8}
.tb-div{width:1px;height:15px;background:rgba(255,255,255,.2);flex:none}
.tb-pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1;
  background:rgba(245,183,0,.14);border:1px solid rgba(245,183,0,.4);color:#FFD873;
  border-radius:999px;padding:5px 12px;font-weight:600}
.tb-pill .ico{width:14px;height:14px;stroke:#FFD873;stroke-width:1.9}
.tb-phone b{font-weight:700;letter-spacing:.02em}

/* ---------- HEADER ---------- */
header.site{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:14px;height:66px}
.logo{display:flex;align-items:center;gap:9px;flex:none}
.logo svg{width:38px;height:38px;flex:none}
.logo-txt b{display:block;font-size:16px;line-height:1.15}
.logo-txt span{display:block;font-size:10px;color:var(--ink-3);letter-spacing:.1em}
.addr{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-m);padding:6px 12px;flex:none;background:#fff}
.addr:hover{border-color:var(--green-line);background:var(--green-soft)}
.addr .t{text-align:start;line-height:1.2}
.addr .t small{display:block;font-size:10.5px;color:var(--ink-3)}
.addr .t b{font-size:12.5px;font-weight:600}
.search{flex:1;position:relative;min-width:140px}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg-2);padding-inline:42px 14px;font-size:13.5px}
.search input:focus{background:#fff;border-color:var(--green);outline:none}
.search .mag{position:absolute;inset-inline-start:14px;top:11px;color:var(--ink-3);pointer-events:none}
.search .clr{position:absolute;inset-inline-end:10px;top:10px;color:var(--ink-3);display:none}
.search.has .clr{display:block}
.hbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:var(--r-m);font-size:13px;font-weight:600;flex:none}
.hbtn:hover{background:var(--line-2)}
.lang{border:1px solid var(--line)}
.cart-btn{position:relative}
.cart-btn .bubble{position:absolute;top:0;inset-inline-end:2px;min-width:18px;height:18px;background:var(--red);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* ---------- SHOP ---------- */
.shell{display:grid;grid-template-columns:var(--side) 1fr;gap:28px;padding-block:22px 60px}
aside{position:sticky;top:112px;align-self:start;max-height:calc(100vh - 132px);overflow:auto}
aside h3{font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:10px;padding-inline-start:12px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:var(--r-m);color:var(--ink-2);font-size:13.5px;font-weight:500}
.nav a:hover{background:var(--bg-2);color:var(--ink)}
.nav a.on{background:var(--green-soft);color:var(--green);font-weight:600}
.nav a .n{font-size:11.5px;color:var(--ink-3)}
.nav a.on .n{color:var(--green)}
.side-card{margin-top:22px;border:1px solid var(--line);border-radius:var(--r-l);padding:16px}
.side-card b{display:block;font-size:13px;margin-bottom:4px}
.side-card p{font-size:12px;color:var(--ink-2);line-height:1.6}
.res{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px}
.res h1{font-size:20px}
.res .count{font-size:12.5px;color:var(--ink-3)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:500;color:var(--ink-2);background:#fff}
.chip:hover{border-color:var(--green-line)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.sec{margin-bottom:36px;scroll-margin-top:120px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sec-head h2{font-size:16.5px}
.sec-head .rule{flex:1;height:1px;background:var(--line)}
.sec-head .n{font-size:12px;color:var(--ink-3);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* ---------- CARD ---------- */
.card{border:1px solid var(--line);border-radius:var(--r-l);background:#fff;padding:12px;display:flex;flex-direction:column;position:relative;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--green-line);box-shadow:var(--shadow)}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:2}
.fav{position:absolute;top:8px;inset-inline-end:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);z-index:2}
.fav:hover{background:var(--line-2);color:var(--red)}
.fav.on .ico{fill:var(--red);stroke:var(--red)}
.shot{position:relative;height:172px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;padding:6px 6px 22px;overflow:hidden;cursor:pointer}
.shot img{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain;mix-blend-mode:multiply}
.size{position:absolute;bottom:0;inset-inline-start:0;background:var(--bg-2);border:1px solid var(--line);color:var(--ink-2);font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.card h3{font-size:13.5px;font-weight:600;line-height:1.4;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.card .cat{font-size:11.5px;color:var(--green);font-weight:600;margin-top:3px}
.prices{display:flex;align-items:baseline;gap:8px;margin-top:8px;flex-wrap:wrap}
.was{font-size:12px;color:var(--ink-3);text-decoration:line-through}
.now{font-size:16px;font-weight:700;color:var(--red)}
.card.plain .now{color:var(--ink)}
.vatnote{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.buy{display:flex;align-items:center;gap:8px;margin-top:12px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-m);height:36px;flex:1}
.step button{width:32px;height:100%;display:grid;place-items:center;color:var(--ink-2);border-radius:var(--r-m)}
.step button:hover{background:var(--line-2);color:var(--green)}
.step .q{flex:1;text-align:center;font-size:13.5px;font-weight:600}
.add{width:44px;height:36px;border-radius:var(--r-m);background:var(--green);color:#fff;display:grid;place-items:center;flex:none;transition:background .15s}
.add:hover{background:var(--green-dark)}
.add.in{background:var(--green-dark)}
.out{position:absolute;inset:0;background:rgba(255,255,255,.72);display:grid;place-items:center;border-radius:var(--r-l);z-index:3}
.out span{background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:6px 14px;border-radius:999px}
.empty{padding:60px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}

/* ---------- FORMS ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.field .hint{font-size:11.5px;color:var(--ink-3);font-weight:400}
.inp{width:100%;height:44px;border:1px solid var(--line);border-radius:var(--r-m);padding-inline:13px;background:#fff;font-size:13.5px}
.inp:focus{border-color:var(--green);outline:none}
.inp.bad{border-color:var(--red);background:var(--red-soft)}
textarea.inp{height:76px;padding-block:11px;resize:vertical}
.err{display:block;font-size:11.5px;color:var(--red);margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-m);padding:13px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s;width:100%;text-align:start}
.opt:hover{border-color:var(--green-line)}
.opt.on{border-color:var(--green);background:var(--green-soft)}
.opt .dot{width:18px;height:18px;border:2px solid var(--line);border-radius:50%;flex:none;margin-top:1px;display:grid;place-items:center}
.opt.on .dot{border-color:var(--green)}
.opt.on .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:13.5px;font-weight:600}
.opt .t small{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px;line-height:1.5}
.opt .tail{font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--green)}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}

.paylogo{height:22px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;display:grid;place-items:center;background:#fff;flex:none}
.paylogo svg{height:13px;width:auto;display:block}

/* ---------- CHECKOUT ---------- */
.co{display:grid;grid-template-columns:1fr 366px;gap:26px;padding-block:22px 70px;align-items:start}
.co-main{display:grid;gap:16px}
.panel{border:1px solid var(--line);border-radius:var(--r-l);background:#fff;overflow:hidden}
.panel > header{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
.panel > header h2{font-size:14.5px}
.panel .stepno{width:24px;height:24px;border-radius:50%;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.panel .body{padding:18px}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);padding-top:18px}
.crumb a:hover{color:var(--green)}
.co h1{font-size:22px;margin:6px 0 2px}

.summary{position:sticky;top:118px;border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.summary > header{padding:15px 18px;border-bottom:1px solid var(--line-2)}
.summary > header h2{font-size:14.5px}
.sum-items{max-height:236px;overflow:auto;padding:6px 18px}
.sum-line{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.sum-line:last-child{border-bottom:none}
.sum-line .th{width:46px;height:46px;border:1px solid var(--line);border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;padding:3px;flex:none;overflow:hidden}
.sum-line .th img{max-height:100%;max-width:100%;width:auto;height:auto;mix-blend-mode:multiply}
.sum-line .i{flex:1;min-width:0}
.sum-line .i b{display:block;font-size:12.5px;font-weight:600;line-height:1.35}
.sum-line .i small{font-size:11px;color:var(--ink-3)}
.sum-line .a{font-size:12.5px;font-weight:700;white-space:nowrap}
.totals{padding:16px 18px;background:var(--bg-2);border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.row.ok{color:var(--green);font-weight:600}
.row.total{color:var(--ink);font-size:16px;font-weight:700;padding-top:10px;border-top:1px solid var(--line);margin:4px 0 0}
.row.vat{font-size:11.5px;color:var(--ink-3);margin-top:6px;margin-bottom:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:var(--r-m);background:var(--green);color:#fff;font-weight:600;font-size:14.5px;transition:background .15s}
.btn:hover{background:var(--green-dark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{height:40px;font-size:13.5px}
.promo{display:flex;gap:8px}
.promo .inp{flex:1}
.promo button{padding-inline:16px;border:1px solid var(--line);border-radius:var(--r-m);font-size:13px;font-weight:600}
.promo button:hover{border-color:var(--green);color:var(--green)}
.note{display:flex;gap:9px;background:var(--green-soft);border:1px solid var(--green-line);border-radius:var(--r-m);padding:11px 13px;font-size:12.5px;color:#155E3F;line-height:1.55}
.note.warn{background:var(--red-soft);border-color:#F6C9C6;color:#8E2019}
.note .ico{width:17px;height:17px;margin-top:1px}

/* ---------- SUCCESS / TRACK / ACCOUNT ---------- */
.page{padding-block:26px 70px}
.hero-ok{text-align:center;padding:34px 20px 26px}
.tick{width:64px;height:64px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 16px}
.tick .ico{width:32px;height:32px;stroke-width:2.4}
.hero-ok h1{font-size:23px;margin-bottom:8px}
.hero-ok p{color:var(--ink-2);font-size:13.5px}
.ordno{display:inline-flex;align-items:center;gap:8px;margin-top:14px;border:1px dashed var(--green-line);background:var(--green-soft);color:var(--green);border-radius:var(--r-m);padding:9px 16px;font-weight:700;font-size:14px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--ink-2)}
.kv b{font-weight:600;text-align:end}
.qr{width:104px;height:104px;border:1px solid var(--line);border-radius:var(--r-s);padding:6px;flex:none;background:#fff}
.track{display:grid;gap:0;padding:6px 0}
.tstep{display:flex;gap:14px}
.tstep .rail{display:flex;flex-direction:column;align-items:center;flex:none}
.tstep .bul{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-3)}
.tstep .bar{width:2px;flex:1;background:var(--line);min-height:26px}
.tstep.done .bul{border-color:var(--green);background:var(--green);color:#fff}
.tstep.done .bar{background:var(--green)}
.tstep.now .bul{border-color:var(--green);color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.tstep .tx{padding-bottom:22px}
.tstep .tx b{display:block;font-size:13.5px}
.tstep .tx small{color:var(--ink-3);font-size:11.5px}
.tstep.done .tx b,.tstep.now .tx b{color:var(--ink)}
.tstep .tx b{color:var(--ink-3)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{padding:11px 15px;font-size:13.5px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--green);border-color:var(--green)}
.ocard{border:1px solid var(--line);border-radius:var(--r-l);padding:16px;margin-bottom:12px}
.ocard header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ocard b{font-size:13.5px}
.ocard small{color:var(--ink-3);font-size:11.5px}
.pill{border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:600}
.pill.live{background:var(--green-soft);color:var(--green)}
.pill.done{background:var(--line-2);color:var(--ink-2)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs .th{width:42px;height:42px;border:1px solid var(--line);border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;padding:3px;overflow:hidden}
.thumbs .th img{max-height:100%;max-width:100%;width:auto;height:auto;mix-blend-mode:multiply}

/* ---------- DRAWER / MODAL ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,33,28,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;inset-inline-end:0;height:100%;width:min(400px,100%);background:#fff;z-index:90;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease}
html[dir=rtl] .drawer{transform:translateX(-100%)}
.drawer.on{transform:none!important}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.d-head b{font-size:15px}
.d-body{flex:1;overflow:auto;padding:6px 18px}
.line{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.line .thumb{width:56px;height:56px;border:1px solid var(--line);border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;padding:4px;flex:none;overflow:hidden}
.line .thumb img{max-height:100%;max-width:100%;width:auto;height:auto;mix-blend-mode:multiply}
.line .info{flex:1;min-width:0}
.line .info b{display:block;font-size:12.5px;font-weight:600;line-height:1.4}
.line .info small{color:var(--ink-3);font-size:11.5px}
.line .mini{display:flex;align-items:center;gap:6px;margin-top:6px}
.line .mini button{width:24px;height:24px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;color:var(--ink-2)}
.line .mini button:hover{border-color:var(--green);color:var(--green)}
.line .mini .q{font-size:12.5px;font-weight:600;min-width:18px;text-align:center}
.line .amt{font-size:13px;font-weight:700;white-space:nowrap}
.d-foot{border-top:1px solid var(--line);padding:16px 18px;background:var(--bg-2)}

.modal{position:fixed;z-index:100;inset-inline:0;top:50%;margin:0 auto;max-width:min(440px,calc(100% - 32px));
  background:#fff;border-radius:var(--r-l);transform:translateY(-50%) scale(.97);opacity:0;pointer-events:none;
  transition:.2s;max-height:88vh;display:flex;flex-direction:column}
.modal.on{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.modal.wide{max-width:min(680px,calc(100% - 32px))}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.m-head b{font-size:15px}
.m-body{padding:18px;overflow:auto}
.m-foot{padding:14px 18px;border-top:1px solid var(--line-2)}
.otpbox{display:flex;gap:10px;justify-content:center;direction:ltr;margin:6px 0 4px}
.otpbox input{width:52px;height:58px;text-align:center;font-size:22px;font-weight:700;border:1px solid var(--line);border-radius:var(--r-m)}
.otpbox input:focus{border-color:var(--green);outline:none}

.pv{display:grid;grid-template-columns:220px 1fr;gap:20px}
.pv .big{border:1px solid var(--line);border-radius:var(--r-m);height:220px;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}
.pv .big img{max-height:100%;max-width:100%;width:auto;height:auto;mix-blend-mode:multiply}
.pv h3{font-size:17px;margin-bottom:4px}

.toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translate(50%,80px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:500;z-index:120;opacity:0;transition:.25s;max-width:88vw;text-align:center}
html[dir=ltr] .toast{transform:translate(-50%,80px)}
.toast.on{opacity:1;transform:translate(50%,0)}
html[dir=ltr] .toast.on{transform:translate(-50%,0)}

footer{border-top:1px solid var(--line);background:var(--bg-2);padding:30px 0 22px}
.f-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px;font-size:12.5px;color:var(--ink-2)}
footer b{display:block;color:var(--ink);font-size:13px;margin-bottom:9px}
footer li{margin-bottom:6px}
footer li a:hover{color:var(--green)}
.legal{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.paybar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

@media (max-width:1080px){
  .shell{grid-template-columns:1fr}
  aside{display:none}
  .co{grid-template-columns:1fr}
  .summary{position:static}
}
@media (max-width:980px){ .topbar .hide-m{display:none} .f-grid{grid-template-columns:1fr 1fr} }
@media (max-width:720px){
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .head{height:auto;flex-wrap:wrap;padding-block:10px;gap:10px}
  .search{order:3;flex-basis:100%}
  .addr{display:none}
  .logo-txt span{display:none}
  .shot{height:140px;padding-bottom:20px}
  .card h3{font-size:12.5px;min-height:35px}
  .topbar .wrap{gap:10px;font-size:11.5px;height:36px}
  .topbar .hide-s{display:none}
  .tb-phone span{display:none}
  .two,.three,.cols2,.opts.g2{grid-template-columns:1fr}
  .pv{grid-template-columns:1fr}
  .f-grid{grid-template-columns:1fr}
}
@media (max-width:380px){ .grid{grid-template-columns:1fr} }
</style>
</head>

/* ---------- money maths (prices are VAT-inclusive) ---------- */
function calc(){
  const lines = Object.entries(S.cart).map(([id,q])=>({p:prod(id),q}));
  const sub = lines.reduce((s,l)=>s+l.p.price*l.q,0);
  let disc = 0, shipFree = false;
  if(S.promo){
    const r = PROMOS[S.promo];
    if(r.type==='pct') disc = sub*r.val/100;
    if(r.type==='ship') shipFree = true;
  }
  const net = sub - disc;
  let ship = 0;
  if(S.mode==='delivery'){
    ship = S.slot==='now' ? CFG.expressFee : CFG.deliveryFee;
    if(shipFree || net >= CFG.freeOver) ship = 0;
  }
  const codFee = S.pay==='cod' ? CFG.codFee : 0;
  const total = net + ship + codFee;
  const vat = total * CFG.vatRate / (1+CFG.vatRate);
  return {lines, sub, disc, ship, codFee, total, vat, count:lines.reduce((s,l)=>s+l.q,0)};
}

function slots(){
  const now = new Date();
  const win = [[10,12],[12,14],[14,16],[16,18],[18,20],[20,22]];
  const out = [];
  [0,1].forEach(d=>{
    win.forEach(([a,z])=>{
      if(d===0 && now.getHours()>=a) return;
      out.push({id:`d${d}-${a}`, day:d, label:`${a}:00 — ${z}:00`});

  });
  return out.slice(0,8);
}

/* ---------- validation ---------- */
const luhn = s => { const d=s.replace(/\D/g,''); if(d.length<13) return false;
  let sum=0,alt=false; for(let i=d.length-1;i>=0;i--){ let n=+d[i];
    if(alt){ n*=2; if(n>9) n-=9; } sum+=n; alt=!alt; } return sum%10===0; };

function validate(){
  S.errs = {};
  if(S.mode==='delivery'){
    if(!S.addr.street.trim()) S.errs.street = t('reqField');
    if(!S.addr.bldg.trim())   S.errs.bldg   = t('reqField');
    if(!S.addr.recv.trim())   S.errs.recv   = t('reqField');
    if(!/^05\d{8}$/.test(S.addr.mob.replace(/\s/g,''))) S.errs.mob = t('badPhone');
  }
  if(S.pay==='card' || S.pay==='mada'){
    if(!luhn(S.card.no))            S.errs.no   = t('badCard');
    if(!S.card.name.trim())         S.errs.name = t('reqField');
    const m = S.card.exp.match(/^(\d{2})\/(\d{2})$/);
    if(!m || +m[1]<1 || +m[1]>12)   S.errs.exp  = t('badExp');
    else { const end = new Date(2000+ +m[2], +m[1], 0); if(end < new Date()) S.errs.exp = t('badExp'); }
    if(!/^\d{3,4}$/.test(S.card.cvv)) S.errs.cvv = t('badCvv');
  }
  if(S.wantsBiz && !/^3\d{13}3$/.test(S.bizVat)) S.errs.biz = t('reqField');
  return Object.keys(S.errs).length===0;
}

    sub:c.sub, disc:c.disc, ship:c.ship, codFee:c.codFee, total:c.total, vat:c.vat,
    mode:S.mode, addr:{...S.addr}, branch:S.branch, slot:S.slot,
    pay:S.pay, promo:S.promo, note:S.note, subst:S.subst,
    bizVat: S.wantsBiz ? S.bizVat : '',
    step:0, driver:{name:'خالد م.', phone:'0550000000'}

  S.orders.unshift(o); S.activeOrder = o;
  S.cart = {}; S.promo = null; S.note=''; S.card={no:'',name:'',exp:'',cvv:''};

  go('success');
  clearInterval(o._t);
  o._t = setInterval(()=>{ if(o.step<3){ o.step++; if(S.view==='track') renderTrack(); } else clearInterval(o._t); }, 9000);
}

function qrSvg(seed){
  let h = 0; for(const ch of seed) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  const N = 21, cells = [];
  const rnd = () => (h = (h*1103515245 + 12345) >>> 0) / 4294967296;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const finder = (x<7&&y<7)||(x>=N-7&&y<7)||(x<7&&y>=N-7);
    if(finder) continue;
    if(rnd()>0.52) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
  }
  const eye = (x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="none" stroke="#16211C" stroke-width="1"/>
    <rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg class="qr" viewBox="0 0 ${N} ${N}" fill="#16211C" shape-rendering="crispEdges">
    ${cells.join('')}${eye(0,0)}${eye(N-7,0)}${eye(0,N-7)}</svg>`;
}

function go(view){
  S.view = view;
  ['shop','checkout','success','track','account'].forEach(v=>$('#view-'+v).hidden = v!==view);
  closeM();
  window.scrollTo({top:0,behavior:'instant'});
  if(view==='checkout') renderCheckout();
  if(view==='success')  renderSuccess();
  if(view==='track')    renderTrack();
  if(view==='account')  renderAccount();
}

function renderAll(){
  renderShop(); renderCart();
  if(S.view==='checkout') renderCheckout();
  if(S.view==='account')  renderAccount();
  $('#acctLbl').textContent = S.user ? t('account') : t('signIn');
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click', e=>{
  const el = s => e.target.closest(s);

  if(el('[data-close]')){ closeM(); }

  const goEl = el('[data-go]');
  if(goEl){ e.preventDefault();
    const v = goEl.dataset.go;
    if(v==='account' && !S.user){ openLogin(()=>go('account')); return; }
    go(v); return; }

  const view = el('[data-view]');
  if(view){ openProduct(view.dataset.view); return; }

  const add = el('[data-add]');
  if(add){
    const p = prod(add.dataset.add);
    if(p.stock===false){ toast(t('outOf')); return; }
    const q = +add.closest('.card,.pv')?.querySelector('.q')?.textContent || 1;
    setQty(p.id, S.cart[p.id] || q); toast(t('added')); closeM(); return;
  }
  const inc = el('[data-inc]');
  if(inc){ const id=inc.dataset.inc;
    if(S.cart[id]) setQty(id,S.cart[id]+1);
    else { const q=inc.closest('.card,.pv')?.querySelector('.q'); if(q) q.textContent=+q.textContent+1; } return; }
  const dec = el('[data-dec]');
  if(dec){ const id=dec.dataset.dec;
    if(S.cart[id]){ const n=S.cart[id]-1; setQty(id,n); if(!n) toast(t('removed')); }
    else { const q=dec.closest('.card,.pv')?.querySelector('.q'); if(q) q.textContent=Math.max(1,+q.textContent-1); } return; }

  const fav = el('[data-fav]');
  if(fav){ const id=fav.dataset.fav; S.fav.has(id)?S.fav.delete(id):S.fav.add(id); fav.classList.toggle('on');
    if(S.view==='account'&&S.acctTab==='fav') renderAccount(); return; }

  const cat = el('[data-cat]');
  if(cat){ e.preventDefault(); S.cat=cat.dataset.cat; if(S.view!=='shop') go('shop'); renderShop();
    if(cat.tagName==='A'&&cat.getAttribute('href')?.startsWith('#sec')) 
      document.querySelector(cat.getAttribute('href'))?.scrollIntoView({behavior:'smooth'});
    else window.scrollTo({top:0,behavior:'smooth'});
    return; }

  const openEl = el('[data-open]');
  if(openEl){ if(openEl.dataset.open==='addrModal') openAddr(); else openM(openEl.dataset.open); return; }

  if(el('#toCheckout')){ closeM();
    if(!S.user){ openLogin(()=>go('checkout')); return; } go('checkout'); return; }

  const mode = el('[data-mode]');   if(mode){ S.mode=mode.dataset.mode; S.errs={}; renderCheckout(); return; }
  const brn  = el('[data-branch]'); if(brn){ S.branch=brn.dataset.branch; renderCheckout(); return; }
  const slot = el('[data-slot]');   if(slot){ S.slot=slot.dataset.slot; renderCheckout(); return; }
  const pay  = el('[data-pay]');    if(pay){ S.pay=pay.dataset.pay; S.errs={}; renderCheckout(); return; }
  const sub  = el('[data-subst]');  if(sub){ S.subst=sub.dataset.subst; renderCheckout(); return; }
  if(el('[data-biz]')){ S.wantsBiz=!S.wantsBiz; renderCheckout(); return; }

  if(el('#promoBtn')){
    const code = ($('#promoIn').value||'').trim().toUpperCase();
    const r = PROMOS[code], c = calc();
    if(!r){ S.promo=null; toast(t('promoBad')); }
    else if(c.sub < r.min){ toast(t('promoMin')(r.min)); }
    else { S.promo=code; toast(t('promoOk')(code)); }
    renderCheckout(); return;
  }

  if(el('#placeBtn')){
    if(!validate()){ renderCheckout();
      document.querySelector('.inp.bad')?.scrollIntoView({behavior:'smooth',block:'center'}); return; }
    const btn = $('#placeBtn'); btn.disabled = true;
    btn.innerHTML = `<svg class="ico s" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" opacity=".3"/><path d="M21 12a9 9 0 0 0-9-9"/></svg> ...`;
    setTimeout(placeOrder, 900); return;
  }

  if(el('#otpSend')){
    const v = ($('#phoneIn').value||'').replace(/\s/g,'');
    if(!/^05\d{8}$/.test(v)){ const er=$('#phoneErr'); er.hidden=false; er.textContent=t('badPhone'); return; }
    S.otpPhone = v; openOtp(); return;
  }
  if(el('#otpBack')){ openLogin(S.afterLogin); return; }
  if(el('#otpVerify')){
    const code = $$('[data-otp]').map(i=>i.value).join('');
    if(code !== '1234'){ const er=$('#otpErr'); er.hidden=false; er.textContent=t('badOtp'); return; }
    S.user = {phone:S.otpPhone};
    if(!S.addr.mob) S.addr.mob = S.otpPhone;
    closeM(); renderAll(); toast(t('signedIn'));
    const a = S.afterLogin; S.afterLogin=null; if(a) a(); return;
  }
  if(el('#logoutBtn')){ S.user=null; S.acctTab='orders'; renderAll(); go('shop'); toast(t('loggedOut')); return; }

  if(el('#addrSave')){ closeM(); $('#addrTxt').textContent = addrLabel(); renderAll(); return; }

  const tab = el('[data-tab]'); if(tab){ S.acctTab=tab.dataset.tab; renderAccount(); return; }
  const tr  = el('[data-track]'); if(tr){ S.activeOrder = S.orders.find(o=>o.no===tr.dataset.track); go('track'); return; }
  const re  = el('[data-reorder]');
  if(re){ const o=S.orders.find(x=>x.no===re.dataset.reorder);
    o.lines.forEach(l=>{ S.cart[l.id]=(S.cart[l.id]||0)+l.q; }); renderAll(); openCart(); toast(t('added')); return; }
});

/* inputs */
document.addEventListener('input', e=>{
  const f = e.target.closest('[data-f]');
  if(f){ S.addr[f.dataset.f] = f.value;
    if(f.dataset.f==='city'||f.dataset.f==='dist') $('#addrTxt').textContent = addrLabel(); return; }
  const f2 = e.target.closest('[data-f2]');
  if(f2){ S[f2.dataset.f2] = f2.value; return; }
  const c = e.target.closest('[data-c]');
  if(c){
    let v = c.value;
    if(c.dataset.c==='no'){ v = v.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim(); c.value=v; }
    if(c.dataset.c==='exp'){ v = v.replace(/\D/g,'').slice(0,4); if(v.length>2) v=v.slice(0,2)+'/'+v.slice(2); c.value=v; }
    if(c.dataset.c==='cvv'){ v = v.replace(/\D/g,'').slice(0,4); c.value=v; }
    S.card[c.dataset.c] = v; return;
  }
  const o = e.target.closest('[data-otp]');
  if(o){ o.value = o.value.replace(/\D/g,'');
    const i = +o.dataset.otp; if(o.value && i<3) $(`[data-otp="${i+1}"]`).focus(); return; }
});

$('#q').addEventListener('input', e=>{
  S.q = e.target.value; $('#searchWrap').classList.toggle('has', !!S.q);
  if(S.view!=='shop') go('shop'); renderShop();
});
$('#clrBtn').onclick = ()=>{ $('#q').value=''; S.q=''; $('#searchWrap').classList.remove('has'); renderShop(); };

const openCart = ()=>{ $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); };
$('#cartBtn').onclick = openCart;
$('#scrim').onclick = closeM;
$('#acctBtn').onclick = ()=> S.user ? go('account') : openLogin(()=>go('account'));
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeM(); });

/* =========================================================
   LANGUAGE
   ========================================================= */
function addrLabel(){ return `${geo('city',S.addr.city)} — ${geo('dist',S.addr.dist)}`; }

$('#langBtn').onclick = ()=> setLang(S.lang==='ar'?'en':'ar');
function setLang(l){
  S.lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l==='ar' ? 'rtl' : 'ltr';
  document.body.className = 'lang-'+l;
  $('#langBtn').textContent = l==='ar' ? 'English' : 'العربية';
  $$('[data-i]').forEach(el=>{ const v=T[l][el.dataset.i]; if(typeof v==='string') el.textContent=v; });
  $('#q').placeholder = t('phSearch');
  $('#phoneNo').textContent = t('phone');
  $('#addrTxt').textContent = addrLabel();
  $('#payBar').innerHTML = ['mada','visa','mc','apple','stc','tabby'].map(logo).join('');
  renderAll();
  if(S.view==='success') renderSuccess();
  if(S.view==='track')   renderTrack();
}

setLang('ar');
</script>
</body>
</html>
